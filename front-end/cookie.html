<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">   
    <title>Cookie Clicker</title>
</head>
<body>
    <div class="username">
        <p id="usernameDisplay">enter your username</p>
        <input type="text" placeholder="username" id="usernameInput">
        <button id="usernameSubmit">submit</button>
    </div>
    <p id="count">0</p> 
    <img id="clickMe" src="./img/images.png" alt="Cookie">
    
    <div class="upgrade">

        <div class="autoclick">
            <p>autoclick</p>
            <button id="autoClickPriceDisplay">25</button>
            <p id="autoClickUpgradeLevelDisplay">0</p>
        </div>

        <div class="clickmultiplier">
            <p>multiplicateur de click</p>
            <button id="clickMultiplierPriceDisplay">50</button>
            <p id="clickMultiplierLevelDisplay">0</p>
        </div>
    </div>

    
    <!-- <button id="reset">reset</button> -->  <!-- <<<<-------reset les donnés d'une partie, utile pour les tests  -->

    <script type="module" src="js/main.js"></script>
</body>
</html>
